<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengumuman Seleksi OSIS SMP Pesat 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff8ec;--bg2:#ffe9c7;--card:#ffffff;--ink:#1d2350;--muted:#5b6190;--line:#e6dcc8;
  --p:#4a3df0;--p2:#8a5cff;--a:#ffb703;--ok:#10b981;--ok2:#d1fae5;--no:#ef6a5b;--no2:#ffe4e0;
  --shadow:0 12px 30px rgba(74,61,240,.15);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12142e;--bg2:#1b1e45;--card:#1f2350;--ink:#f4f2ff;--muted:#a9aedb;--line:#33387a;
  --ok2:#0b3b2e;--no2:#4a2420;--shadow:0 12px 30px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#12142e;--bg2:#1b1e45;--card:#1f2350;--ink:#f4f2ff;--muted:#a9aedb;--line:#33387a;
  --ok2:#0b3b2e;--no2:#4a2420;--shadow:0 12px 30px rgba(0,0,0,.4);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;font-weight:700;overflow-x:hidden;position:relative}
h1,h2,h3,.fr{font-family:'Fredoka','Nunito',system-ui,sans-serif}
.blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;z-index:0;animation:float 9s ease-in-out infinite;pointer-events:none}
.b1{width:180px;height:180px;background:var(--a);top:-50px;right:-40px}
.b2{width:130px;height:130px;background:var(--p2);bottom:12%;left:-50px;animation-delay:-3s}
.b3{width:70px;height:70px;background:var(--ok);top:42%;right:6%;animation-delay:-5s;opacity:.35}
@keyframes float{50%{transform:translateY(-22px) rotate(8deg)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.8rem;color:var(--muted)}
.theme{border:2px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.hero{text-align:center;margin:26px 0 22px}
.logo{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;background:linear-gradient(135deg,var(--p),var(--p2));
  display:grid;place-items:center;font-size:3rem;box-shadow:var(--shadow);transform:rotate(-6deg);animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(6deg) scale(1.05)}}
h1{margin:0;font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.1;font-weight:700}
h1 span{background:linear-gradient(90deg,var(--p),var(--p2) 60%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:10px auto 0;color:var(--muted);max-width:420px;line-height:1.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
label{display:block;font-family:'Fredoka',sans-serif;font-size:1.05rem;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none;transition:.2s}
input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(74,61,240,.18)}
button.go{flex:1 1 100%;font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:#fff;border:0;cursor:pointer;padding:15px;border-radius:16px;
  background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 6px 0 #3225c4;transition:.1s}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #3225c4}
.hint{margin:12px 2px 0;font-size:.82rem;color:var(--muted);font-weight:600}
#out{margin-top:20px}
.res{border-radius:26px;padding:26px 20px;text-align:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;border:2px solid}
.res.ok{background:var(--ok2);border-color:var(--ok)}
.res.no{background:var(--no2);border-color:var(--no)}
.res.warn{background:var(--card);border-color:var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(20px)}}
.emo{font-size:3.4rem;line-height:1;display:block;margin-bottom:8px}
.res h2{margin:0 0 4px;font-size:1.5rem}
.name{font-family:'Fredoka',sans-serif;font-size:clamp(1.3rem,6vw,1.8rem);font-weight:700;margin:10px 0;word-break:break-word}
.pill{display:inline-block;background:var(--ok);color:#fff;border-radius:99px;padding:8px 16px;font-size:.92rem;margin:4px 0 12px}
.res p{margin:6px 0 0;line-height:1.55;color:var(--muted)}
.res.ok p{color:var(--ink)}
.load{text-align:center;padding:30px 0}
.dots span{display:inline-block;width:14px;height:14px;margin:0 5px;border-radius:50%;background:var(--p);animation:bn .8s infinite}
.dots span:nth-child(2){background:var(--p2);animation-delay:.15s}.dots span:nth-child(3){background:var(--a);animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-14px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.6rem;color:var(--p)}
.stat small{font-size:.72rem;color:var(--muted)}
footer{margin-top:26px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.5}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="cv"></canvas>
<div class="wrap">
  <div class="top">
    <span class="badge">📣 Pengumuman Resmi</span>
    <button class="theme" id="th" aria-label="Ganti tema">🌙</button>
  </div>

  <header class="hero">
    <div class="logo" aria-hidden="true">🎓</div>
    <h1>Hasil Seleksi<br><span>OSIS SMP Pesat</span></h1>
    <p class="sub">Tahun 2026 · Ketik namamu untuk melihat hasil seleksi wawancara.</p>
  </header>

  <main>
    <section class="card">
      <label for="q">✨ Siapa namamu?</label>
      <div class="row">
        <input id="q" type="text" placeholder="Ketik nama lengkap…" autocomplete="off" autocapitalize="words" enterkeyhint="search">
        <button class="go" id="go">Cek Hasil 🚀</button>
      </div>
      <p class="hint">💡 Tulis nama lengkap sesuai pendaftaran agar hasil akurat.</p>
    </section>
    <div id="out" aria-live="polite"></div>

    <div class="stats">
      <div class="stat"><b>47</b><small>Peserta Lolos</small></div>
      <div class="stat"><b>6</b><small>Calon Ketua/Wakil</small></div>
      <div class="stat"><b>41</b><small>Anggota OSIS</small></div>
    </div>
  </main>

  <footer>© 2026 OSIS SMP Pesat<br>Jika ada kendala, hubungi pembina OSIS.</footer>
</div>

<script>
// 0 = Calon Ketua/Calon Wakil Ketua OSIS, 1 = Anggota OSIS
var D=[
["Alysia Ayu Ramadhani",0],["Dalisha Syakira Nuriansyah",0],["Callysta Dira",0],["Muhammad Fatih Alkina",0],["Jasmine Kayla Salsabila",0],["Fatih Ariban Niskala",0],["Zaafarani Hasanah Badadal",1],
["Syakila Azzaliya Farsya",1],["Qisya Silwinika Charizkie",1],["Quorra Khaliqa Diandra Adzkira",1],["Aisha Nayara Putri Aditya",1],["Alesha Naila Zahran",1],["Sheriel Az-zahra Setiyadi",1],["Kinanthi syarifah kusumaningru.",1],["Syeikha Shidqia Aurlyn",1],["Raied Rayyan Hakiki.",1],["Ratu Andalusia",1],["Syamima Adziqa Mahira",1],["Nasywa Azzahra Firdaus",1],["Athaya Nayshilla Ghaisani",1],["anichsa amalia kinanti",1],["Aqila Siti Fachrunnisa",1],["Arsyla Justitia Andrian",1],["Aina Mardhiyah",1],["Earlene Kennes Dharmaputri",1],["Nazwa ainindiva",1],["Adhwa Faradisa Pranenda",1],["Fahira Rizqi Shafiyya",1],["Khailila Khadijah",1],["Khansa Fazila Azkadina",1],["Tanisha Ranakhaira",1],["Garneta Hasya Permana",1],["Raisa Salsabila",1],["Dayanara Ilmira Pradiva",1],["M. Saladin Shakeel Auliya",1],["Gusti Sabka",1],["Aliana Azka Naditya",1],["Khalda Wahyushubhi",1],["faranissa Kirana Djunaedi",1],["Aswin Hannan Kolopaking",1],["Alinka Aureliakanaya Umaran",1],["Almamaira zahreen fauzi",1],["Ahza Samudhia Pranaja",1],["aleya kavaya mahera",1],["Radinka Aisyah Putri Kertapati",1],["Khanza Athifa Khalilah",1],["Ali musthafa al ghazali",1]
];
var ROLE=["Calon Ketua / Calon Wakil Ketua OSIS","Anggota OSIS"];
function norm(s){return s.toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim()}
function pretty(s){return s.replace(/\.$/,'').toLowerCase().replace(/(^|[\s-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var N=D.map(function(r){var n=norm(r[0]);return {n:n,t:n.split(' '),r:r}});

function find(q){
  var nq=norm(q);
  var ex=N.filter(function(x){return x.n===nq});
  if(ex.length===1)return {s:'one',x:ex[0]};
  var qt=nq.split(' ');
  var m=N.filter(function(x){return qt.every(function(t){return x.t.some(function(w){return w.indexOf(t)===0})})});
  if(m.length===1)return {s:'one',x:m[0]};
  if(m.length>1)return {s:'many'};
  return {s:'none'};
}

var out=document.getElementById('out'),inp=document.getElementById('q'),busy=false;
function show(h){out.innerHTML=h}
function check(){
  if(busy)return;
  var q=inp.value.trim();
  if(norm(q).length<3){show('<div class="res warn"><span class="emo">🤔</span><h2>Namamu belum terisi</h2><p>Ketik minimal 3 huruf dari nama lengkapmu ya.</p></div>');return}
  busy=true;inp.blur();
  show('<div class="load"><div class="dots"><span></span><span></span><span></span></div><p class="fr" style="margin:14px 0 0;color:var(--muted)">Membuka amplop…</p></div>');
  out.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(function(){
    var r=find(q);
    if(r.s==='one'){
      show('<div class="res ok"><span class="emo">🎉</span><h2 class="fr">Selamat!</h2><div class="name">'+esc(pretty(r.x.r[0]))+'</div>'
        +'<span class="pill">✅ Lolos sebagai '+ROLE[r.x.r[1]]+'</span>'
        +'<p>Kamu berhasil melewati seleksi OSIS SMP Pesat 2026. Tunggu informasi selanjutnya dari pembina OSIS ya! 🌟</p></div>');
      confetti();
    }else if(r.s==='many'){
      show('<div class="res warn"><span class="emo">🔎</span><h2 class="fr">Ada beberapa nama mirip</h2><p>Ketik nama lengkapmu agar hasilnya tepat.</p></div>');
    }else{
      show('<div class="res no"><span class="emo">💪</span><h2 class="fr">Belum berhasil kali ini</h2><p>Namamu tidak ada dalam daftar peserta yang lolos. Pastikan ejaan sudah benar. Terima kasih sudah mendaftar dan tetap semangat berkontribusi untuk sekolah!</p></div>');
    }
    busy=false;
  },1300);
}
document.getElementById('go').onclick=check;
inp.addEventListener('keydown',function(e){if(e.key==='Enter')check()});

// Confetti
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=[],raf;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
size();addEventListener('resize',size);
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cols=['#ffb703','#4a3df0','#8a5cff','#10b981','#ef6a5b','#38bdf8'],d=devicePixelRatio;
  for(var i=0;i<140;i++)P.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*15-4)*d,w:(6+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],l:1});
  cancelAnimationFrame(raf);tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return p.l>0&&p.y<cv.height+50});
  P.forEach(function(p){
    p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l-=.005;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  if(P.length)raf=requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);
}

// Theme toggle
var th=document.getElementById('th'),root=document.documentElement;
function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function icon(){th.textContent=dark()?'☀️':'🌙'}
th.onclick=function(){root.setAttribute('data-theme',dark()?'light':'dark');icon()};
icon();
</script>
</body>
</html>
